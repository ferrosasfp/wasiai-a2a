name: ci

# Real CI gate: enforces the full test suite, typecheck and lint on every PR
# and on push to main. Runs WITHOUT secrets or a live database — the Postgres
# *.real.test.ts integration tests are skipIf-gated on INTEGRATION_TEST_DB_URL,
# which is intentionally absent here, so they are skipped (not failed).
# This complements smoke-downstream.yml (network smoke), it does not replace it.

on:
  push:
    branches: [main]
  pull_request:

# Este workflow sólo lee el árbol: no comenta PRs, no publica, no toca el
# registry. Sin este bloque los jobs heredan el default del repo, que puede ser
# read/write sobre todos los scopes.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -p tsconfig.json --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # ⚠️ Los dos sub-paquetes de abajo tienen su PROPIO package.json y su
      # propio runner: el `npm test` de acá arriba es `vitest run` con
      # include `src/**` + `test/**`, así que no los toca ni por accidente.
      # Estuvieron huérfanos hasta AR-3 de WKH-322: 347 + 30 tests verdes que
      # no corría nadie, incluidos los tres de regresión de un BLOQUEANTE
      # (borrar el fix de `handlers.mjs` dejaba este CI en verde).
      # El guardián que impide que un sub-paquete nuevo vuelva a nacer huérfano
      # es `test/test-files-are-run-in-ci.test.ts`, y descubre los runners
      # leyendo ESTE archivo: agregar el step de abajo es lo que lo pone verde.
      #
      # ⚠️ `--ignore-scripts` EXPLÍCITO en los dos installs de sub-paquete.
      # El `.npmrc` de la raíz fija `ignore-scripts=true` ("do NOT remove this
      # flag globally"), pero npm resuelve el .npmrc de proyecto desde el prefix
      # (el directorio con package.json), NO de los ancestros. Medido:
      #   $ npm config get ignore-scripts                              → true
      #   $ cd mcp-servers/wasiai-x402 && npm config get ignore-scripts → false
      #   $ cd packages/agent-sdk      && npm config get ignore-scripts → false
      # O sea que sin la bandera estos dos steps instalaban con preinstall/
      # postinstall HABILITADOS — exactamente el vector que el .npmrc existe
      # para cerrar. Peor en agent-sdk: sin package-lock.json, `npm install`
      # re-resuelve los `^` en cada corrida, así que una patch comprometida de
      # cualquier transitiva ejecutaría código en el runner.
      - name: Install dependencies (mcp-servers/wasiai-x402)
        working-directory: mcp-servers/wasiai-x402
        run: npm ci --ignore-scripts

      - name: Test (mcp-servers/wasiai-x402)
        working-directory: mcp-servers/wasiai-x402
        run: npm test

      # `npm install` y no `npm ci`: este paquete no tiene package-lock.json
      # propio. Generarlo es un cambio aparte; sin él, `npm ci` falla.
      - name: Install dependencies (packages/agent-sdk)
        working-directory: packages/agent-sdk
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Test (packages/agent-sdk)
        working-directory: packages/agent-sdk
        run: npm test

  coverage:
    runs-on: ubuntu-latest
    # Coverage runs the same suite with v8 coverage + thresholds. The Postgres
    # *.real.test.ts integration tests stay skipIf-gated on
    # INTEGRATION_TEST_DB_URL (absent here), so coverage reflects the unit
    # suite only and does not block on a live database.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test with coverage
        run: npm run test:coverage
